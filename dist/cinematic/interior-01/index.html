<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KorVista Design cinematic interior hero motion study.">
  <title>Atelier North — Cinematic Interior</title>
  <link rel="preload" href="../../assets/interior-01/evening.png" as="image">
  <link rel="preload" href="../../assets/interior-01/daylight.png" as="image">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f2ea;
      --muted: rgba(246, 242, 234, .72);
      --line: rgba(255, 255, 255, .24);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #17130f;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    .scene {
      position: absolute;
      inset: -3%;
      opacity: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      will-change: transform, opacity;
    }

    .scene-one {
      background-image: url("../../assets/interior-01/evening.png");
      animation: sceneOne 20s linear infinite, dollyIn 20s ease-in-out infinite;
    }

    .scene-two {
      background-image: url("../../assets/interior-01/daylight.png");
      animation: sceneTwo 20s linear infinite, lateralMove 20s ease-in-out infinite;
    }

    .grade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(19, 15, 12, .72) 0%, rgba(19, 15, 12, .34) 34%, transparent 64%),
        linear-gradient(180deg, rgba(15, 12, 10, .22), transparent 40%, rgba(15, 12, 10, .28));
      pointer-events: none;
    }

    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px clamp(24px, 5vw, 80px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: inherit;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .nav-note {
      color: var(--muted);
      font-size: .76rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      align-content: center;
      min-height: calc(100svh - 82px);
      width: min(1440px, 100%);
      padding: clamp(44px, 8vw, 118px) clamp(24px, 5vw, 80px);
    }

    .copy { max-width: 720px; }
    .eyebrow {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: reveal .9s .25s both;
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 8vw, 8.4rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .88;
      animation: reveal 1.15s .45s both;
    }

    .subcopy {
      max-width: 500px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.18rem);
      line-height: 1.55;
      animation: reveal 1s .7s both;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin-top: 34px;
      padding: 15px 20px;
      border: 1px solid rgba(255, 255, 255, .45);
      color: var(--ink);
      text-decoration: none;
      font-size: .78rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      background: rgba(21, 17, 13, .12);
      transition: background .3s ease, transform .3s ease;
      animation: reveal 1s .85s both;
    }
    .cta:hover { background: rgba(255, 255, 255, .16); transform: translateY(-2px); }

    .motion-label {
      position: absolute;
      right: clamp(24px, 5vw, 80px);
      bottom: 28px;
      z-index: 2;
      color: rgba(255,255,255,.68);
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @keyframes sceneOne {
      0%, 42% { opacity: 1; }
      50%, 92% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes sceneTwo {
      0%, 42% { opacity: 0; }
      50%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes dollyIn {
      0% { transform: scale(1.02); }
      49% { transform: scale(1.12); }
      50%, 100% { transform: scale(1.02); }
    }
    @keyframes lateralMove {
      0%, 48% { transform: scale(1.07) translateX(-2.4%); }
      96% { transform: scale(1.07) translateX(2.4%); }
      100% { transform: scale(1.07) translateX(-2.4%); }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .nav { padding-block: 21px; }
      .nav-note { display: none; }
      .content { align-content: end; padding-bottom: 105px; }
      .copy { max-width: 92%; }
      h1 { font-size: clamp(3.25rem, 17vw, 5.6rem); }
      .subcopy { max-width: 390px; }
      .scene { background-position: 61% center; }
      .grade {
        background:
          linear-gradient(180deg, rgba(17, 14, 11, .12) 5%, rgba(17, 14, 11, .18) 35%, rgba(17, 14, 11, .82) 86%),
          linear-gradient(90deg, rgba(17, 14, 11, .3), transparent 72%);
      }
      .motion-label { left: 24px; right: auto; bottom: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .eyebrow, h1, .subcopy, .cta { animation: none !important; }
      .scene-one { opacity: 1; transform: scale(1.02); }
      .scene-two { display: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="scene scene-one" aria-hidden="true"></div>
    <div class="scene scene-two" aria-hidden="true"></div>
    <div class="grade" aria-hidden="true"></div>

    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="../../" aria-label="Back to Motion Hero Lab">KorVista · Motion Lab</a>
      <div class="nav-note">Interior Architecture · Washington, DC</div>
    </nav>

    <section class="content">
      <div class="copy">
        <p class="eyebrow">Spaces for considered living</p>
        <h1>Quietly<br>remarkable.</h1>
        <p class="subcopy">Interiors shaped by natural materials, thoughtful light and the way you actually live.</p>
        <a class="cta" href="#" onclick="return false">View selected work <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <div class="motion-label">Cinematic motion study · 01</div>
  </main>
</body>
</html>
