<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KorVista Design immersive layered parallax interior hero study.">
  <title>Atelier North — Immersive Parallax Interior</title>
  <link rel="preload" href="../../assets/interior-01/evening.png" as="image">
  <link rel="preload" href="../../assets/interior-01/daylight.png" as="image">
  <link rel="preload" href="../../assets/interior-parallax/background.png" as="image">
  <link rel="preload" href="../../assets/interior-parallax/foreground.png" as="image">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f1e8;
      --muted: rgba(246, 241, 232, .72);
      --line: rgba(255, 255, 255, .25);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #1c1712;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    a { color: inherit; }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      cursor: crosshair;
    }

    .scene {
      position: absolute;
      inset: -3%;
      z-index: -3;
      opacity: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .scene-one {
      background-image: url("../../assets/interior-01/evening.png");
      animation: sceneOne 15s linear infinite, dollyIn 15s ease-in-out infinite;
    }

    .scene-two {
      background-image: url("../../assets/interior-01/daylight.png");
      animation: sceneTwo 15s linear infinite, lateralMove 15s ease-in-out infinite;
    }

    .scene-three {
      inset: 0;
      animation: sceneThree 15s linear infinite, dollyOut 15s ease-in-out infinite;
    }

    .scene-three-front { z-index: 2; }

    .layer {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      will-change: transform;
    }

    .layer-background {
      transform: scale(1.08);
    }

    .layer-foreground {
      transform: scale(1.08);
      filter: drop-shadow(0 22px 28px rgba(24, 17, 10, .16));
    }

    .wash {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(20, 15, 11, .70) 0%, rgba(20, 15, 11, .32) 36%, transparent 66%),
        linear-gradient(180deg, rgba(18, 13, 10, .14), transparent 52%, rgba(18, 13, 10, .30));
      pointer-events: none;
    }

    .nav {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 86px;
      padding: 0 clamp(24px, 5vw, 80px);
      border-bottom: 1px solid var(--line);
      font-size: .75rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand { font-weight: 700; text-decoration: none; }
    .nav-note { color: var(--muted); }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: center;
      min-height: calc(100svh - 86px);
      padding: clamp(50px, 8vw, 110px) clamp(24px, 7vw, 112px) 120px;
      pointer-events: none;
      will-change: transform;
    }

    .copy { max-width: 820px; }
    .eyebrow {
      margin: 0 0 24px;
      color: rgba(255,255,255,.82);
      font-size: .75rem;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4.2rem, 9.6vw, 10rem);
      font-weight: 400;
      letter-spacing: -.065em;
      line-height: .82;
      text-wrap: balance;
    }

    .subcopy {
      max-width: 520px;
      margin: 34px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.55;
    }

    .motion-label {
      position: absolute;
      right: clamp(24px, 5vw, 80px);
      bottom: 30px;
      z-index: 5;
      color: rgba(255,255,255,.68);
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .depth-meter {
      position: absolute;
      left: clamp(24px, 5vw, 80px);
      bottom: 29px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.68);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .depth-meter::before {
      content: "";
      width: 42px;
      height: 1px;
      background: rgba(255,255,255,.55);
    }

    @keyframes sceneOne {
      0%, 27% { opacity: 1; }
      34%, 93% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes sceneTwo {
      0%, 27% { opacity: 0; }
      34%, 60% { opacity: 1; }
      67%, 100% { opacity: 0; }
    }

    @keyframes sceneThree {
      0%, 60% { opacity: 0; }
      67%, 93% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes dollyIn {
      0% { transform: scale(1); }
      33% { transform: scale(1.16); }
      34%, 100% { transform: scale(1); }
    }

    @keyframes lateralMove {
      0%, 33% { transform: scale(1.09) translateX(-3.5%); }
      66% { transform: scale(1.09) translateX(3.5%); }
      67%, 100% { transform: scale(1.09) translateX(-3.5%); }
    }

    @keyframes dollyOut {
      0%, 66% { transform: scale(1.16); }
      99% { transform: scale(1); }
      100% { transform: scale(1.16); }
    }

    @media (max-width: 700px) {
      .nav { min-height: 72px; }
      .nav-note { display: none; }
      .content { align-content: end; min-height: calc(100svh - 72px); padding-bottom: 112px; }
      h1 { font-size: clamp(3.7rem, 18vw, 6rem); }
      .subcopy { max-width: 88%; }
      .layer, .scene { object-position: 57% center; background-position: 57% center; }
      .wash {
        background:
          linear-gradient(180deg, rgba(18, 13, 10, .10) 8%, rgba(18, 13, 10, .20) 42%, rgba(18, 13, 10, .82) 88%),
          linear-gradient(90deg, rgba(18, 13, 10, .26), transparent 72%);
      }
      .depth-meter { display: none; }
      .motion-label { left: 24px; right: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .layer, .content { animation: none !important; transform: none !important; }
      .scene-one { opacity: 1; }
      .scene-two, .scene-three { display: none; }
      .hero { cursor: default; }
    }
  </style>
</head>
<body>
  <main class="hero" id="parallax-hero">
    <div class="scene scene-one" aria-hidden="true"></div>
    <div class="scene scene-two" aria-hidden="true"></div>
    <div class="scene scene-three scene-three-back" aria-hidden="true">
      <img class="layer layer-background" src="../../assets/interior-parallax/background.png" alt="">
    </div>
    <div class="wash" aria-hidden="true"></div>

    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="../../">KorVista · Motion Lab</a>
      <div class="nav-note">Atelier North · Washington, DC</div>
    </nav>

    <section class="content">
      <div class="copy">
        <p class="eyebrow">Interior architecture · Layered study</p>
        <h1>Depth you<br>can feel.</h1>
        <p class="subcopy">A quiet residence revealed through natural materials, warm light and a subtle sense of movement.</p>
      </div>
    </section>

    <div class="scene scene-three scene-three-front" aria-hidden="true">
      <img class="layer layer-foreground" src="../../assets/interior-parallax/foreground.png" alt="">
    </div>
    <div class="depth-meter">Move to explore</div>
    <div class="motion-label">Immersive parallax study · 02</div>
  </main>

  <script>
    (() => {
      const hero = document.getElementById('parallax-hero');
      const background = hero.querySelector('.layer-background');
      const foreground = hero.querySelector('.layer-foreground');
      const content = hero.querySelector('.content');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let interacting = false;

      const setTarget = (clientX, clientY) => {
        const rect = hero.getBoundingClientRect();
        targetX = ((clientX - rect.left) / rect.width - .5) * 34;
        targetY = ((clientY - rect.top) / rect.height - .5) * 22;
      };

      hero.addEventListener('pointermove', event => {
        interacting = true;
        setTarget(event.clientX, event.clientY);
      });

      hero.addEventListener('pointerleave', () => {
        interacting = false;
        targetX = 0;
        targetY = 0;
      });

      const render = time => {
        const driftX = interacting ? 0 : Math.sin(time * .00042) * 8;
        const driftY = interacting ? 0 : Math.cos(time * .00034) * 4;
        const desiredX = targetX + driftX;
        const desiredY = targetY + driftY;

        currentX += (desiredX - currentX) * .065;
        currentY += (desiredY - currentY) * .065;

        background.style.transform = `translate3d(${-currentX * .24}px, ${-currentY * .18}px, 0) scale(1.08)`;
        content.style.transform = `translate3d(${currentX * .34}px, ${currentY * .24}px, 0)`;
        foreground.style.transform = `translate3d(${currentX * 1.15}px, ${currentY * .82}px, 0) scale(1.08)`;
        requestAnimationFrame(render);
      };

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
